# Sert le dashboard statique et relaie les appels vers les 3 services (évite tout problème de CORS).
# Le resolver Docker + variables : nginx démarre même si un service n'est pas encore prêt.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    location /collector/ {
        set $upstream http://collector-service:8080;
        rewrite ^/collector/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /storage/ {
        set $upstream http://storage-service:8080;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /analytics/ {
        set $upstream http://analytics-service:8080;
        rewrite ^/analytics/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
}
